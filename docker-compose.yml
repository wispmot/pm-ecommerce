services:

  postgres:
    image: postgres:16
    container_name: pm-ecommerce-postgres
    environment:
      POSTGRES_DB: pm_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
